layout: {qmk_keyboard: splitkb/aurora/sofle_v2/rev1, layout_name: LAYOUT}
layers:
  DEF:
  - [LALT, '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', RALT]
  - [ESC, Q, W, F, P, G, J, L, U, Y, {t: '-', s: '_'}, MISC]
  - [LSFT, A, R, S, T, D, H, N, E, I, O, RSFT]
  - [LCTL, Z, X, C, V, B, MUTE, MPLY, K, M, {t: ',', s: ';'}, {t: '.', s: ':'}, {t: '''', s: '"'}, RCTL]
  - [KB, DEL, SPC, TAB, LGUI, RGUI, ENT, SYM, BSPC, CAPS]
  SYM:
  - [{t: LALT, type: trans}, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, {t: RALT, type: trans}]
  - [{t: ESC, type: trans}, '@', '!', '&', '|', '~', 'Ü', '?', '[', ']', 'Ö', {t: MISC, type: trans}]
  - [{t: LSFT, type: trans}, Ä, '$', '+', '*', '/', '%', '{', '(', ')', '}', {t: RSFT, type: trans}]
  - [{t: LCTL, type: trans}, 'ß', '<', '>', '=', '\', {t: MUTE, type: trans}, {t: MPLY, type: trans}, '´', '#', '^', '`', ESC, {t: RCTL, type: trans}]
  - [{t: KB, type: trans}, {t: DEL, type: trans}, {t: SPC, type: trans}, {t: TAB, type: trans}, {t: LGUI, type: trans}, {t: RGUI, type: trans}, {t: ENT, type: trans}, {type: held}, {t: BSPC, type: trans}, {t: CAPS, type: trans}]
  MISC:
  - [{t: LALT, type: trans}, F11, F12, F13, F14, F15, F16, F17, F18, F19, F20, {t: RALT, type: trans}]
  - [{t: ESC, type: trans}, '', PGDN, UP, PGUP, HOME, '', '', '', '', {t: LAYER LOCK, type: held}, {type: held}]
  - [{t: LSFT, type: trans}, '', LEFT, DOWN, RGHT, FIND, '', '', '', '', '', {t: RSFT, type: trans}]
  - [{t: LCTL, type: trans}, '', '', '', '', '', {t: MUTE, type: trans}, {t: MPLY, type: trans}, 'DE ´', '', 'DE ^', 'DE `', '', {t: RCTL, type: trans}]
  - [{t: KB, type: trans}, {t: DEL, type: trans}, {t: SPC, type: trans}, TAB, {t: LGUI, type: trans}, {t: RGUI, type: trans}, ENT, '', {t: BSPC, type: trans}, {t: CAPS, type: trans}]
  KB:
  - [BOOT, '', '', '', '', '', '', '', '', '', '', SWITCH MODE]
  - ['', '', '', '', '', '', BAD APLE, RM NEXT, RM HUEU, RM SATU, RM VALU, RM SPDU]
  - ['', '', '', '', '', '', RM TOGG, RM PREV, RM HUED, RM SATD, RM VALD, RM SPDD]
  - ['', '', '', '', '', '', {t: MUTE, type: trans}, {t: MPLY, type: trans}, '', '', '', '', '', '']
  - [{type: held}, {t: DEL, type: trans}, {t: SPC, type: trans}, {t: TAB, type: trans}, {t: LGUI, type: trans}, {t: RGUI, type: trans}, {t: ENT, type: trans}, '', {t: BSPC, type: trans}, {t: RALT, type: trans}]
  GAMING:
  - [LALT, '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', SWITCH MODE]
  - [ESC, P, Q, W, E, R, T, Y, U, I, O, RALT]
  - [LSFT, M, A, S, D, F, G, H, J, K, L, RSFT]
  - [LCTL, Z, X, C, V, B, MUTE, MPLY, N, M, ',', ., '''', RCTL]
  - [KB, BSPC, SPC, TAB, LGUI, RGUI, ENT, '', BSPC, RALT]
